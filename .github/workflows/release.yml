name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate tag and package versions
        run: |
          python - <<'PY'
          import json
          import tomllib
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
            raise SystemExit(f"tag must start with v: {tag}")
          tag_version = tag[1:]

          with open("pyproject.toml", "rb") as f:
            pyproject = tomllib.load(f)
          py_version = pyproject["project"]["version"]

          with open("package.json", "r", encoding="utf-8") as f:
            package = json.load(f)
          npm_version = package["version"]

          if py_version != npm_version:
            raise SystemExit(
              f"version mismatch: pyproject.toml={py_version} package.json={npm_version}"
            )
          if tag_version != py_version:
            raise SystemExit(
              f"tag/version mismatch: tag={tag_version} package={py_version}"
            )

          print(f"release version verified: {py_version}")
          PY

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest build twine

      - name: Run tests
        run: pytest tests -q

      - name: Build Python distributions
        run: python -m build

      - name: Validate Python distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed Python CLI
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          pip install dist/*.whl
          tmp_dir=$(mktemp -d)
          ai-push-hooks --help > /dev/null
          (
            cd "$tmp_dir"
            ai-push-hooks init --template minimal-docs
          )

      - name: Smoke-test npm wrapper
        run: npm run test:npm-pack

      - name: Upload Python dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download Python dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist/

      - name: Check whether PyPI version already exists
        id: pypi-version
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"].removeprefix("v")
          url = f"https://pypi.org/pypi/ai-push-hooks/{version}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              exists = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          PY

      - name: Publish to PyPI
        if: steps.pypi-version.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-npm:
    needs: [verify, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check whether npm version already exists
        id: npm-version
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          if npm view "ai-push-hooks@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Record npm deployment status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_VERSION_EXISTED: ${{ steps.npm-version.outputs.exists }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          ref = os.environ["GITHUB_REF_NAME"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          deployment_payload = {
              "ref": ref,
              "environment": "npm",
              "description": "npm publish",
              "auto_merge": False,
              "transient_environment": False,
              "production_environment": False,
              "required_contexts": [],
          }
          deployment_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/deployments",
              data=json.dumps(deployment_payload).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(deployment_request) as response:
              deployment = json.load(response)

          description = (
              "npm version already available"
              if os.environ["NPM_VERSION_EXISTED"] == "true"
              else "npm publish successful"
          )
          status_payload = {
              "state": "success",
              "log_url": run_url,
              "description": description,
          }
          status_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/deployments/{deployment['id']}/statuses",
              data=json.dumps(status_payload).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(status_request):
              pass

          print(f"Recorded npm deployment {deployment['id']} as success")
          PY

  create-github-release:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
