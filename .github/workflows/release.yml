name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      recover_release:
        description: "Publish an existing immutable release artifact set and finish the release"
        required: false
        default: false
        type: boolean
      recover_bookkeeping:
        description: "Only recover an already-created npm deployment status"
        required: false
        default: false
        type: boolean
      tag:
        description: "Release tag used by the recovery"
        required: false
        type: string
      commit:
        description: "Expected full commit SHA for the recovery"
        required: false
        type: string
      artifact_id:
        description: "Immutable Actions artifact ID containing the release set (preferred; leave empty for the v0.3.0 draft-asset recovery)"
        required: false
        type: string
      deployment_id:
        description: "Existing GitHub deployment id"
        required: false
        type: string
      run_url:
        description: "Run URL to put in the recovered deployment status"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_ROOT: release-set

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      npm_version: ${{ steps.release.outputs.npm_version }}
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate source, tag, commit, and version policy
        id: release
        run: |
          python scripts/release_validation.py validate \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --release-channel release-channel.toml \
            --output "$GITHUB_OUTPUT"

      - name: Install pinned validation tools
        run: python -m pip install --requirement constraints-ci.txt

      - name: Run deterministic tests
        run: python -m pytest tests -q --ignore=tests/test_installed_hook_e2e.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Build the immutable release set once
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NPM_VERSION: ${{ steps.release.outputs.npm_version }}
        run: |
          rm -rf "$RELEASE_ROOT"
          mkdir -p "$RELEASE_ROOT/python" "$RELEASE_ROOT/npm"
          PIP_CONSTRAINT="$GITHUB_WORKSPACE/constraints-ci.txt" \
            python -m build --outdir "$RELEASE_ROOT/python"
          npm pack --json --pack-destination "$RELEASE_ROOT/npm" > "$RELEASE_ROOT/npm-pack.json"
          python scripts/release_validation.py manifest \
            --root "$RELEASE_ROOT" \
            --version "$VERSION" \
            --npm-version "$NPM_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --release-channel release-channel.toml \
            --output "$RELEASE_ROOT/checksum-manifest.json"
          python -m twine check "$RELEASE_ROOT/python"/*

      - name: Smoke-test the exact wheel
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/pip" install --no-index --no-deps "$RELEASE_ROOT/python"/*.whl
          "$smoke_dir/venv/bin/ai-push-hooks" --help > /dev/null
          (
            cd "$smoke_dir"
            "$smoke_dir/venv/bin/ai-push-hooks" init --template minimal-docs
          )

      - name: Smoke-test the exact npm tarball without network fallback
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          npm init -y --prefix "$smoke_dir" > /dev/null
          npm install --prefix "$smoke_dir" --ignore-scripts --no-audit --no-fund \
            "$RELEASE_ROOT/npm"/*.tgz
          "$smoke_dir/node_modules/.bin/ai-push-hooks" --help > /dev/null
          (
            cd "$smoke_dir"
            "$smoke_dir/node_modules/.bin/ai-push-hooks" init --template minimal-docs
          )

      - name: Run installed-hook E2E against exact promoted artifacts
        run: |
          wheel_path=$(python scripts/release_validation.py manifest-artifact \
            --manifest "$RELEASE_ROOT/checksum-manifest.json" --kind wheel)
          npm_path=$(python scripts/release_validation.py manifest-artifact \
            --manifest "$RELEASE_ROOT/checksum-manifest.json" --kind npm)
          AI_PUSH_HOOKS_RELEASE_WHEEL="$RELEASE_ROOT/$wheel_path" \
            AI_PUSH_HOOKS_RELEASE_NPM_TARBALL="$RELEASE_ROOT/$npm_path" \
            python -m pytest -q tests/test_installed_hook_e2e.py \
              -k test_installed_hook_runs_real_local_push_scenario

      - name: Upload the immutable release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-set-${{ github.ref_name }}
          path: release-set/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download immutable release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-set-${{ github.ref_name }}
          path: release-set/

      - name: Check PyPI artifact identities
        id: pypi
        run: |
          python scripts/release_validation.py registry-check \
            --registry pypi \
            --manifest "$RELEASE_ROOT/checksum-manifest.json" \
            --decision "$RELEASE_ROOT/pypi-decision.json" \
            --output "$GITHUB_OUTPUT"

      - name: Stage only missing approved artifacts
        if: steps.pypi.outputs.publish_required == 'true'
        run: |
          python scripts/release_validation.py stage-missing \
            --manifest "$RELEASE_ROOT/checksum-manifest.json" \
            --root "$RELEASE_ROOT" \
            --decision "$RELEASE_ROOT/pypi-decision.json" \
            --destination pypi-publish

      - name: Publish missing PyPI artifacts once
        if: steps.pypi.outputs.publish_required == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-publish

      - name: Verify PyPI identities after publish with bounded propagation wait
        if: always()
        run: |
          python scripts/release_validation.py registry-verify \
            --registry pypi \
            --manifest "$RELEASE_ROOT/checksum-manifest.json"

  publish-npm:
    if: github.event_name == 'push'
    needs: [verify, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python for bounded registry validation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download immutable release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-set-${{ github.ref_name }}
          path: release-set/

      - name: Check npm artifact identity
        id: npm
        run: |
          python scripts/release_validation.py registry-check \
            --registry npm \
            --manifest "$RELEASE_ROOT/checksum-manifest.json" \
            --decision "$RELEASE_ROOT/npm-decision.json" \
            --output "$GITHUB_OUTPUT"

      - name: Publish the exact npm tarball once
        if: steps.npm.outputs.publish_required == 'true'
        continue-on-error: true
        env:
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "10000"
        run: |
          npm publish \
            "$RELEASE_ROOT/$(python scripts/release_validation.py manifest-artifact \
              --manifest "$RELEASE_ROOT/checksum-manifest.json" --kind npm)" \
            --access public \
            --tag "$(python scripts/release_validation.py manifest-value \
              --manifest "$RELEASE_ROOT/checksum-manifest.json" --key npm_dist_tag)" \
            --provenance

      - name: Verify npm identity after the single publish attempt
        if: always()
        run: |
          python scripts/release_validation.py registry-verify \
            --registry npm \
            --manifest "$RELEASE_ROOT/checksum-manifest.json"

  record-npm-bookkeeping:
    if: github.event_name == 'push'
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download immutable release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-set-${{ github.ref_name }}
          path: release-set/

      - name: Record bookkeeping without republishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_validation.py record-deployment \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --manifest "$RELEASE_ROOT/checksum-manifest.json"

  create-github-release:
    if: github.event_name == 'push'
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download immutable release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-set-${{ github.ref_name }}
          path: release-set/

      - name: Create or verify the correctly-classified GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_validation.py github-release \
            --repo "$GITHUB_REPOSITORY" \
            --manifest "$RELEASE_ROOT/checksum-manifest.json"

  recover-bookkeeping:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_bookkeeping == true && inputs.recover_release != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout recovery helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Recover only the deployment status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RECOVERY_COMMIT: ${{ inputs.commit }}
          RECOVERY_RUN_URL: ${{ inputs.run_url }}
        run: |
          test -n "$DEPLOYMENT_ID" -a -n "$RECOVERY_RUN_URL"
          python scripts/release_validation.py recover-deployment \
            --repo "$GITHUB_REPOSITORY" \
            --deployment-id "$DEPLOYMENT_ID" \
            --tag "$RECOVERY_TAG" \
            --commit "$RECOVERY_COMMIT" \
            --run-url "$RECOVERY_RUN_URL"

  recover-release:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_release == true && inputs.recover_bookkeeping != true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      deployments: write
      id-token: write
    env:
      RECOVERY_TAG: ${{ inputs.tag }}
      RECOVERY_COMMIT: ${{ inputs.commit }}
      RECOVERY_ARTIFACT_ID: ${{ inputs.artifact_id }}
      RECOVERY_ROOT: recovery-set
    steps:
      - name: Require recovery inputs
        run: |
          set -eu
          test -n "$RECOVERY_TAG"
          test -n "$RECOVERY_COMMIT"
          if test -n "$RECOVERY_ARTIFACT_ID"; then
            case "$RECOVERY_ARTIFACT_ID" in
              ''|*[!0-9]*)
                printf 'artifact_id must be a numeric immutable Actions artifact ID\n' >&2
                exit 2
                ;;
            esac
          fi

      - name: Checkout trusted recovery helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Fetch and bind the fully-qualified release tag
        run: |
          set -eu
          git check-ref-format "refs/tags/$RECOVERY_TAG"
          git fetch --no-tags origin "refs/tags/$RECOVERY_TAG:refs/tags/$RECOVERY_TAG"
          tag_commit=$(git rev-parse "refs/tags/$RECOVERY_TAG^{}")
          test "$tag_commit" = "$RECOVERY_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/release-source" "refs/tags/$RECOVERY_TAG"
          source_commit=$(git -C "$RUNNER_TEMP/release-source" rev-parse HEAD)
          test "$source_commit" = "$RECOVERY_COMMIT"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download the immutable release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if test -n "$RECOVERY_ARTIFACT_ID"; then
            mkdir -p "$RECOVERY_ROOT"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT_ID/zip" \
              > "$RUNNER_TEMP/recovery-artifact.zip"
            unzip -q "$RUNNER_TEMP/recovery-artifact.zip" -d "$RECOVERY_ROOT"
          else
            mkdir -p "$RECOVERY_ROOT/python" "$RECOVERY_ROOT/npm"
            for name in \
              checksum-manifest.json \
              ai_push_hooks-0.3.0-py3-none-any.whl \
              ai_push_hooks-0.3.0.tar.gz \
              ai-push-hooks-0.3.0.tgz; do
              asset_url=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/tags/$RECOVERY_TAG" \
                --jq ".assets[] | select(.name == \"$name\") | .url")
              test -n "$asset_url"
              gh api \
                --header 'Accept: application/octet-stream' \
                "$asset_url" > "$RECOVERY_ROOT/$name"
            done
            mv "$RECOVERY_ROOT/ai_push_hooks-0.3.0-py3-none-any.whl" "$RECOVERY_ROOT/python/"
            mv "$RECOVERY_ROOT/ai_push_hooks-0.3.0.tar.gz" "$RECOVERY_ROOT/python/"
            mv "$RECOVERY_ROOT/ai-push-hooks-0.3.0.tgz" "$RECOVERY_ROOT/npm/"
          fi

      - name: Validate release binding and downloaded artifact identities
        env:
          RELEASE_ROOT: ${{ env.RECOVERY_ROOT }}
        run: |
          set -eu
          python scripts/release_validation.py validate \
            --tag "$RECOVERY_TAG" \
            --commit "$RECOVERY_COMMIT" \
            --pyproject "$RUNNER_TEMP/release-source/pyproject.toml" \
            --package-json "$RUNNER_TEMP/release-source/package.json" \
            --release-channel "$RUNNER_TEMP/release-source/release-channel.toml"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RELEASE_ROOT"]).resolve()
          manifest_path = root / "checksum-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("project") != "ai-push-hooks":
              raise SystemExit("recovery manifest has the wrong project")
          if manifest.get("tag") != os.environ["RECOVERY_TAG"]:
              raise SystemExit("recovery manifest tag does not match the requested tag")
          if manifest.get("commit") != os.environ["RECOVERY_COMMIT"]:
              raise SystemExit("recovery manifest commit does not match the requested commit")

          artifacts = manifest.get("artifacts")
          if not isinstance(artifacts, list) or len(artifacts) != 3:
              raise SystemExit("recovery manifest must contain exactly three artifacts")
          kinds = {item.get("kind") for item in artifacts if isinstance(item, dict)}
          if kinds != {"wheel", "sdist", "npm"}:
              raise SystemExit("recovery manifest must contain wheel, sdist, and npm artifacts")

          approved_paths = set()
          for artifact in artifacts:
              if not isinstance(artifact, dict):
                  raise SystemExit("recovery manifest contains a malformed artifact")
              relative = artifact.get("path")
              if not isinstance(relative, str) or relative in approved_paths:
                  raise SystemExit("recovery manifest contains a duplicate or invalid path")
              approved_paths.add(relative)
              path = (root / relative).resolve()
              try:
                  path.relative_to(root)
              except ValueError as exc:
                  raise SystemExit("recovery artifact path escapes the release root") from exc
              if not path.is_file():
                  raise SystemExit(f"recovery artifact is missing: {relative}")
              if path.stat().st_size != artifact.get("size"):
                  raise SystemExit(f"recovery artifact size mismatch: {relative}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != artifact.get("sha256"):
                  raise SystemExit(f"recovery artifact hash mismatch: {relative}")

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz") or path.suffix == ".tgz":
                  if relative not in approved_paths:
                      raise SystemExit(f"unapproved release artifact is present: {relative}")
          print("downloaded recovery artifacts match checksum-manifest.json")
          PY

      - name: Confirm PyPI is complete without republishing
        run: |
          set -eu
          python scripts/release_validation.py registry-check \
            --registry pypi \
            --manifest "$RECOVERY_ROOT/checksum-manifest.json" \
            --decision "$RECOVERY_ROOT/pypi-decision.json"
          state=$(python -c \
            'import json, sys; print(json.load(open(sys.argv[1]))["state"])' \
            "$RECOVERY_ROOT/pypi-decision.json")
          test "$state" = complete

      - name: Check npm artifact identity
        id: npm
        run: |
          python scripts/release_validation.py registry-check \
            --registry npm \
            --manifest "$RECOVERY_ROOT/checksum-manifest.json" \
            --decision "$RECOVERY_ROOT/npm-decision.json" \
            --output "$GITHUB_OUTPUT"

      - name: Publish the exact npm tarball once
        if: steps.npm.outputs.publish_required == 'true'
        continue-on-error: true
        env:
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "10000"
        run: |
          npm publish \
            "$RECOVERY_ROOT/$(python scripts/release_validation.py manifest-artifact \
              --manifest "$RECOVERY_ROOT/checksum-manifest.json" --kind npm)" \
            --access public \
            --tag "$(python scripts/release_validation.py manifest-value \
              --manifest "$RECOVERY_ROOT/checksum-manifest.json" --key npm_dist_tag)" \
            --provenance

      - name: Verify npm identity after the single publish attempt
        id: verify-npm
        if: always()
        run: |
          python scripts/release_validation.py registry-verify \
            --registry npm \
            --manifest "$RECOVERY_ROOT/checksum-manifest.json"

      - name: Record verified npm deployment bookkeeping
        if: steps.verify-npm.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_validation.py record-deployment \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RECOVERY_TAG" \
            --commit "$RECOVERY_COMMIT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --manifest "$RECOVERY_ROOT/checksum-manifest.json"

      - name: Activate the verified prerelease without changing its assets
        if: steps.verify-npm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true

      - name: Create or verify the correctly-classified GitHub release
        if: steps.verify-npm.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_validation.py github-release \
            --repo "$GITHUB_REPOSITORY" \
            --manifest "$RECOVERY_ROOT/checksum-manifest.json"
