name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ai-push-hooks. Do not include secrets, provider credentials, or private transcripts.
  - type: input
    id: version
    attributes:
      label: ai-push-hooks version
      placeholder: 0.1.19
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, installation method, and OpenCode version
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste a minimal, redacted ai-push-hooks.toml excerpt.
      render: toml
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not a privately reportable security vulnerability. I will use the repository Security Advisory form for vulnerabilities.
          required: true
